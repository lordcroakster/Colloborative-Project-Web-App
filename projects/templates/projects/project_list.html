<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
    
</head>
<body>
    <h1>Project Page</h1>
    <h2>Create New Project</h2>
    <form id="create-project-form">
        <label>Project Name</label>
        <input type="text" id="project-name">

        <label>Project Description</label>
        <input type="text" id="project-description">

        <button type="submit">Create</button>
    </form>
    <h2>Projects</h2>
    <div id="project-list"></div>
</body>

<script>
    
    const projectList=document.getElementById("project-list")
    const create_project_form=document.getElementById("create-project-form")

    async function loadProjects(){
        const response=await fetch("/api/projects/");
        const data=await response.json();
        
        data.forEach(function(project){
            const projectElement=document.createElement("a");
            const breakElement=document.createElement("br");
            projectElement.innerText=project.name;
            projectElement.href="/api/projects/" + project.id + "/project-detail/";
            projectList.append(projectElement);
            projectList.append(breakElement);
        });
    };

    create_project_form.addEventListener("submit", async function(event){
        event.preventDefault();
        const projectName=document.getElementById("project-name");
        const projectDescription=document.getElementById("project-description");

        const response=await fetch("/api/projects/create/", {
            method: "POST",
            body: JSON.stringify({
                name: projectName.value,
                description: projectDescription.value
            }),
            headers: {
                "Content-Type": "application/json"
            }
        });

        const data=await response.json();
        if(response.ok){
            console.log("created");
                projectName.value="";
                projectDescription.value="";
                projectList.innerHTML="";

                loadProjects();
        }else{
            console.log("error")
        }

    })

    loadProjects()
</script>

</html>
